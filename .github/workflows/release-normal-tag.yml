name: Release normal tag

# Publishes the annotated normal release tag vX.Y.Z at the exact merge of a reviewed release preparation,
# when the Owner asks and every gate of the evidence contract holds. Policy: issue #36. The contract, the
# record formats and what the tests prove: scripts/release/README.md.
#
# OFF BY DEFAULT. Nothing is written unless the repository variable RELEASE_NORMAL_PUBLICATION is exactly
# `enabled`. That variable is separate from RELEASE_BUILD_PUBLICATION. Until it is set, a dispatch runs the
# read-only evaluation and writes a job summary, and nothing else. The controller checks the variable again
# before it writes.
#
# Started by hand, from main, by the Owner. The inputs name the evidence; they satisfy nothing. The
# controller reads GitHub's record of this run and refuses unless the Owner started it and started its
# current attempt, and it reads every record, the deployment and CI from GitHub. GitHub cannot tell the
# Owner from an agent using the Owner's login, so the Owner posts the approval and dispatches personally.
#
# Trust. No job checks out anything but main or runs a pull request's code. Dependencies install once,
# lockfile-pinned with lifecycle scripts disabled, in the evaluation job, which cannot write. The tag is
# written by the shared tag writer, which installs nothing, checks the digest of this run's bundle, holds
# the one repository-wide writer lock, and evaluates everything again before it writes. Inputs reach
# scripts as environment variables, never as expressions.
#
# No deployment, migration, production credential or secret is used. Publishing the tag triggers nothing
# in this repository: no workflow here runs on a tag or a release.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: The exact merge to tag, the preparation pull request's merge, as a full sha.
        required: true
        type: string
      version:
        description: The normal version, X.Y.Z.
        required: true
        type: string
      preparation-pr:
        description: The preparation pull request's number.
        required: true
        type: string
      deployment:
        description: The GitHub deployment id of Vercel's production deployment of the sha.
        required: true
        type: string
      review:
        description: The independent READY record, comment:<id>@sha256:<digest>.
        required: true
        type: string
      production-acceptance:
        description: The production-verification acceptance record, comment:<id>@sha256:<digest>.
        required: true
        type: string
      owner-approval:
        description: The Owner's release approval record, comment:<id>@sha256:<digest>.
        required: true
        type: string
      hosted-migration:
        description: The hosted migration record, or none when the migration tree is unchanged.
        required: true
        default: none
        type: string

permissions: {}

jobs:
  evaluate:
    name: Check every gate of the release request
    # A dispatch from any other branch runs nothing.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: read
    outputs:
      decision: ${{ steps.evaluate.outputs.decision }}
      bundle-digest: ${{ steps.bundle.outputs.digest }}
    steps:
      # Pinned to the exact commits the CI workflow's `@v4` resolves to today.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check every gate of the release request
        id: evaluate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          PREPARATION_PR: ${{ inputs.preparation-pr }}
          DEPLOYMENT: ${{ inputs.deployment }}
          REVIEW_RECORD: ${{ inputs.review }}
          ACCEPTANCE_RECORD: ${{ inputs.production-acceptance }}
          APPROVAL_RECORD: ${{ inputs.owner-approval }}
          HOSTED_MIGRATION_RECORD: ${{ inputs.hosted-migration }}
        run: |
          # 0: every gate holds, or the tag already is this release. Any other status is a refusal, a pending
          # gate or a failure, reported in the job summary, and stops the release here.
          node scripts/release/controller.mjs evaluate-release \
            --repo "$GITHUB_REPOSITORY" --repo-id "$GITHUB_REPOSITORY_ID" --main-ref origin/main \
            --sha "$RELEASE_SHA" --version "$RELEASE_VERSION" --preparation-pr "$PREPARATION_PR" \
            --deployment "$DEPLOYMENT" --review "$REVIEW_RECORD" --production-acceptance "$ACCEPTANCE_RECORD" \
            --owner-approval "$APPROVAL_RECORD" --hosted-migration "$HOSTED_MIGRATION_RECORD" \
            --dispatch-run-id "$GITHUB_RUN_ID" --dispatch-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --format json --outputs "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" \
            > "$RUNNER_TEMP/release-plan.json"
      - name: Bundle the plan and the controller's pinned dependencies for the tag writer
        id: bundle
        if: vars.RELEASE_NORMAL_PUBLICATION == 'enabled' && steps.evaluate.outputs.decision == 'eligible'
        run: |
          node scripts/release/controller.mjs runtime-dependencies > "$RUNNER_TEMP/bundle-files.txt"
          cp "$RUNNER_TEMP/release-plan.json" release-plan.json
          tar -cf "$RUNNER_TEMP/release-controller-bundle.tar" release-plan.json -T "$RUNNER_TEMP/bundle-files.txt"
          rm release-plan.json
          echo "digest=$(sha256sum "$RUNNER_TEMP/release-controller-bundle.tar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: vars.RELEASE_NORMAL_PUBLICATION == 'enabled' && steps.evaluate.outputs.decision == 'eligible'
        with:
          name: release-controller-bundle
          path: ${{ runner.temp }}/release-controller-bundle.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the normal tag
    needs: evaluate
    if: needs.evaluate.outputs.decision == 'eligible' && vars.RELEASE_NORMAL_PUBLICATION == 'enabled'
    permissions:
      contents: write
      actions: read
      pull-requests: read
      deployments: read
    uses: ./.github/workflows/release-tag-writer.yml
    with:
      operation: normal
      bundle-digest: ${{ needs.evaluate.outputs.bundle-digest }}
