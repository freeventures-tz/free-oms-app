name: CI

# One validation per pull-request update, and one per push to main after a merge.
#
# A feature branch used to be tested twice for every commit: once for the push and once for the pull
# request. Pull requests now carry the feature check, on GitHub's merge of the branch into its base
# (the combination that would actually land), and pushes are tested only on main, which is the
# post-merge check of what really landed. Draft pull requests are validated like any other.
#
# The Release Gate (release-gate.yml) calls this same workflow for an exact candidate commit, so the
# release check and the feature check can never run different suites.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact commit to test
        type: string
        required: true
      gate:
        description: development or release
        type: string
        required: true
      base:
        description: The production commit the candidate is compared with, if known
        type: string
        required: false
        default: ""

# A newer push to the same pull request cancels its older test run, and nothing else. Every other
# run, a push to main or a release candidate, has a group of its own (its run id), so it is never
# cancelled or held back by another run.
concurrency:
  group: oms-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only. No job here holds a secret, deploys, migrates a hosted database or publishes anything.
# Every key used below is generated by the local Supabase stack inside the runner.
permissions:
  contents: read

defaults:
  run:
    # Explicit, so pipelines fail on the first failing command (`-eo pipefail`): a `tee` must not
    # turn a failing suite into a green step.
    shell: bash

env:
  OMS_TEST_RESULTS_DIR: ${{ github.workspace }}/oms-test/results

# The order below is deliberate: the cheapest checks that can fail run first, and every test that
# touches a database runs against a stack started FROM THIS REPOSITORY'S config.toml. Auth settings
# and exposed schemas are configuration, not migrations — a stack started before the config is in
# place proves the wrong thing.
jobs:
  plan:
    name: Plan tests (shadow)
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.identity.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Full history: the selector needs the merge base and refuses a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identify base and head
        id: identity
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_BASE: ${{ inputs.base }}
        run: |
          head="$(git rev-parse HEAD)"
          base=""
          case "$EVENT" in
            pull_request)
              # The checkout is GitHub's merge commit: its first parent is the base branch tip and its
              # second is the pull request's head. Anything else is not the combination under test.
              base="$(git rev-parse HEAD^1)"
              if [ "$(git rev-parse HEAD^2)" != "$PR_HEAD" ]; then
                echo "::error::The checkout is not the merge of this pull request's head"
                exit 1
              fi
              ;;
            push) base="$BEFORE" ;;
            *) base="$RELEASE_BASE" ;;
          esac
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Select tests (reported, not enforced)
        env:
          BASE: ${{ steps.identity.outputs.base }}
          HEAD_SHA: ${{ steps.identity.outputs.head }}
          MODE: ${{ inputs.gate == 'release' && 'full' || 'shadow' }}
        run: |
          mkdir -p oms-test/plan
          node scripts/testing/select.mjs --base "$BASE" --head "$HEAD_SHA" --mode "$MODE" --output oms-test/plan/plan.json
      - name: Plan with the approved base's rules
        # The minimum a pull request must run comes from the base it merges into, never from the
        # pull request alone. While the base has no selector, the gate requires the full inventory.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ steps.identity.outputs.base }}
          HEAD_SHA: ${{ steps.identity.outputs.head }}
        run: |
          if git cat-file -e "$BASE:scripts/testing/select.mjs" 2>/dev/null; then
            mkdir -p .base-policy
            git archive "$BASE" scripts/testing | tar -x -C .base-policy
            node .base-policy/scripts/testing/select.mjs --base "$BASE" --head "$HEAD_SHA" --mode shadow \
              --manifest .base-policy/scripts/testing/manifest.json --output oms-test/plan/base-plan.json
          else
            echo "The approved base has no selector; the gate requires the full inventory."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: oms-test/plan/
          retention-days: 14

  static:
    name: Lint · Types · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-static
          path: oms-test/results/
          if-no-files-found: ignore
          retention-days: 14

  database:
    name: Migrations · pgTAP · Advisors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned deliberately. With `latest`, a run that passed yesterday can fail today with no
          # change of ours, and "verified" stops meaning anything. Bump it as a visible commit.
          version: 2.113.0
      - name: Start Supabase
        run: supabase start
      - name: Migrations apply from a clean database
        run: supabase db reset
      - name: Migration chain preserves a real database, three times over
        # Independent of each migration's own snapshot checks, and three separate proofs.
        #
        # FIRST, and before any database work: the 34 released migrations are re-hashed against
        # the manifest in supabase/release-checks. A released migration is history the hosted
        # database has already applied, so editing one is refused here rather than discovered
        # later; a correction is always a NEW forward migration.
        #
        # PART C resets to migration 21 twice: once with no prices, which is the database
        # production actually is, and once with a real price row written through the real command.
        #
        # V0.0.5 resets to migration 32 — the last released one — and builds customers, orders,
        # invoices, money, credit and a signed dispatch through the released commands before
        # applying 33 and 34 on top. It applies THOSE TWO ONLY, with anything later held back,
        # because its own assertion is that nothing from a later release came with it.
        #
        # V0.0.6 resets to migration 34 — the v0.0.5 boundary now in production — builds the same
        # ground PLUS an approved brick batch and an inspected curing lot, and applies 35 and 36
        # on top. That phase is where the sixteen re-issued commands, the api surface a deployed
        # browser still calls, and the absence of any imprest, report or Cron object are checked.
        #
        # Each time it runs the release gate's own preservation query before and after applying
        # the ordinary way, and requires the two answers to be identical. Each phase then damages
        # its own fixture in ways no count can see and requires the gate to NOTICE — a gate that
        # cannot say no has never said yes. It then resets to migration 33 alone and checks the
        # state a hosted apply passes through. Restores the full database after, and fails the
        # job if it cannot.
        #
        # The log is kept so the gate can count the counterexamples that actually ran.
        run: |
          mkdir -p oms-test/results
          npm run test:migration-chain 2>&1 | tee oms-test/results/migration-chain.log
      - name: pgTAP
        run: |
          mkdir -p oms-test/results
          supabase test db 2>&1 | tee oms-test/results/pgtap.log
      - name: Database lint
        run: supabase db lint --level warning
      - name: Database advisors
        # `db lint` is a plpgsql checker, not the advisors. The CLI has no advisors command, so the
        # rules live in supabase/advisors.sql and this step fails on any blocking finding.
        run: node scripts/run-advisors.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-database
          path: oms-test/results/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Auth & Data API integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned deliberately. With `latest`, a run that passed yesterday can fail today with no
          # change of ours, and "verified" stops meaning anything. Bump it as a visible commit.
          version: 2.113.0
      - name: Start Supabase
        run: supabase start
      - name: Write local environment
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SECRET_KEY=$(supabase status -o env | grep '^SECRET_KEY=' | cut -d= -f2- | tr -d '\"')"
          } > .env.test.local
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-integration
          path: oms-test/results/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Responsive authentication E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned deliberately. With `latest`, a run that passed yesterday can fail today with no
          # change of ours, and "verified" stops meaning anything. Bump it as a visible commit.
          version: 2.113.0
      - name: Start Supabase
        run: supabase start
      - name: Write local environment
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SECRET_KEY=$(supabase status -o env | grep '^SECRET_KEY=' | cut -d= -f2- | tr -d '\"')"
          } > .env.local
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-e2e
          path: oms-test/results/
          if-no-files-found: ignore
          retention-days: 14

  gate:
    # The one required check. It runs whatever happened above (`always()`), and passes only when it
    # can see that every expected job succeeded and every required test ran and passed
    # (scripts/testing/gate.mjs). A failed, cancelled, skipped, timed-out or missing job, a missing
    # report, a test that never ran, an unexplained skip or a suite with zero tests all refuse it.
    name: ${{ inputs.gate == 'release' && 'Release Gate' || 'Development Gate' }}
    if: always()
    needs: [plan, static, database, integration, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A missing artifact is not allowed to fail the gate with a download error instead of a
      # reason. The gate script below refuses a missing plan or report by name, so these two
      # downloads may come back empty without the gate ever passing because of it.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: plan
          path: oms-test/plan
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: results-*
          path: oms-test/results
          merge-multiple: true
      - name: Decide
        env:
          OMS_GATE_NEEDS: ${{ toJSON(needs) }}
          GATE: ${{ inputs.gate == 'release' && 'Release Gate' || 'Development Gate' }}
        run: |
          mkdir -p oms-test/results
          node scripts/testing/gate.mjs \
            --plan oms-test/plan/plan.json \
            --base-plan oms-test/plan/base-plan.json \
            --results oms-test/results \
            --head "$(git rev-parse HEAD)" \
            --gate "$GATE" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --report oms-test/gate-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: oms-test/gate-report.json
          if-no-files-found: ignore
          retention-days: 30
