name: Release normal tag (standing)

# Publishes the annotated normal release tag vX.Y.Z for a release below the policy's stable version, under
# the Owner's standing authorization. Policy: issue #36. The contract, the record formats and what the tests
# prove: scripts/release/README.md.
#
# OFF BY DEFAULT. Nothing is written unless the repository variable RELEASE_NORMAL_PUBLICATION is exactly
# `enabled`. That variable is separate from RELEASE_BUILD_PUBLICATION. Until it is set, a comment runs the
# read-only evaluation and writes a job summary, and nothing else. The controller checks the variable again
# before it writes.
#
# Started by the Owner posting a production-acceptance record on a merged release preparation. The Owner
# decided in advance that a release below the stable version needs no separate approval, so that record is
# the whole authorisation: nothing else here authorises anything, and a stable version cannot be reached
# through this workflow at all.
#
# UNTRUSTED UNTIL PROVED. A comment event is public data. Two things stand between it and the writer:
#
#   1. the static guard below, which runs no job at all unless GitHub says the comment's author is the
#      Owner's exact login and numeric id, the same pair the release-evidence policy names; and
#   2. the controller, which is handed the comment's id and nothing else it can act on. It reads the body,
#      the author and the location from the API and checks all of them again. The event's claim about which
#      pull request the comment is on is passed only to be compared with the API's answer.
#
# No event value is ever expanded into a script. The evaluation job cannot write. The privileged job is the
# shared tag writer, which checks out main, installs nothing, runs no pull-request code, and holds the one
# repository-wide writer lock.
#
# No deployment, migration, production credential or secret is used. Publishing the tag triggers nothing in
# this repository: no workflow here runs on a tag or a release.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  evaluate:
    name: Check every gate of the release the acceptance asks for
    # The Owner's account is the only identity GitHub authenticates for this repository. A comment from any
    # other account, or on an issue rather than a pull request, reaches no job and so no write permission.
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'freeventures-tz' &&
      github.event.comment.user.id == 313431047
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: read
    outputs:
      decision: ${{ steps.evaluate.outputs.decision }}
      bundle-digest: ${{ steps.bundle.outputs.digest }}
    steps:
      # Pinned to the exact commits the CI workflow's `@v4` resolves to today. main only: a pull request's
      # own code is never checked out, and never runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check every gate of the release the acceptance asks for
        id: evaluate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACCEPTANCE_COMMENT: ${{ github.event.comment.id }}
          EVENT_PULL_REQUEST: ${{ github.event.issue.number }}
        run: |
          # 0: every gate holds, or the tag already is this release. Any other status is a refusal, a pending
          # gate or a failure, reported in the job summary, and stops the release here. A comment that is not
          # a production-acceptance record at all refuses like any other unusable one.
          node scripts/release/controller.mjs evaluate-standing-release \
            --repo "$GITHUB_REPOSITORY" --repo-id "$GITHUB_REPOSITORY_ID" --main-ref origin/main \
            --acceptance-comment "$ACCEPTANCE_COMMENT" --event-pull-request "$EVENT_PULL_REQUEST" \
            --dispatch-run-id "$GITHUB_RUN_ID" --dispatch-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --format json --outputs "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" \
            > "$RUNNER_TEMP/release-plan.json"
      - name: Bundle the plan and the controller's pinned dependencies for the tag writer
        id: bundle
        if: vars.RELEASE_NORMAL_PUBLICATION == 'enabled' && steps.evaluate.outputs.decision == 'eligible'
        run: |
          node scripts/release/controller.mjs runtime-dependencies > "$RUNNER_TEMP/bundle-files.txt"
          cp "$RUNNER_TEMP/release-plan.json" release-plan.json
          tar -cf "$RUNNER_TEMP/release-controller-bundle.tar" release-plan.json -T "$RUNNER_TEMP/bundle-files.txt"
          rm release-plan.json
          echo "digest=$(sha256sum "$RUNNER_TEMP/release-controller-bundle.tar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: vars.RELEASE_NORMAL_PUBLICATION == 'enabled' && steps.evaluate.outputs.decision == 'eligible'
        with:
          name: release-controller-bundle
          path: ${{ runner.temp }}/release-controller-bundle.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the normal tag
    needs: evaluate
    # The Owner guard is repeated here so the job that holds `contents: write` states its own condition, and
    # does not depend on reading the guard off another job to be safe.
    if: >-
      needs.evaluate.outputs.decision == 'eligible' &&
      vars.RELEASE_NORMAL_PUBLICATION == 'enabled' &&
      github.event.comment.user.login == 'freeventures-tz' &&
      github.event.comment.user.id == 313431047
    permissions:
      contents: write
      actions: read
      pull-requests: read
      deployments: read
    uses: ./.github/workflows/release-tag-writer.yml
    with:
      operation: normal
      bundle-digest: ${{ needs.evaluate.outputs.bundle-digest }}
